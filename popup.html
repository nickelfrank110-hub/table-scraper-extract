<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 220px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 12px;
      margin: 0;
      background-color: #f9fafb;
    }
    h3 {
      margin-top: 0;
      color: #111827;
      font-size: 14px;
      text-align: center;
    }
    button {
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    #status {
      margin-top: 8px;
      font-size: 11px;
      color: #6b7280;
      text-align: center;
    }
  </style>
</head>
<body>
  <h3>Table Data Extractor</h3>
  <button id="scrape-btn">Scrape Tables to CSV</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
